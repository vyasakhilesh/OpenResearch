services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: prefect
      POSTGRES_DB: prefect
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect"]
      interval: 10s
      timeout: 5s
      retries: 5

  prefect-server:
    image: prefecthq/prefect:3-latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Prefect server needs a SQLAlchemy URL for the API DB
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:prefect@postgres:5432/prefect
    ports:
      - "4200:4200"   # Prefect UI and API
    command: ["prefect", "server", "start", "--no-services"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:4200/api/health', timeout=1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  prefect-services:
    image: prefecthq/prefect:3-latest
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:prefect@postgres:5432/prefect
    command: ["prefect", "server", "services", "start"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4200/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  prefect-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    depends_on:
      prefect-services:
        condition: service_healthy
    environment:
      PREFECT_API_URL: http://localhost:4200/api
    volumes:
      - ./:/app
    command: ["prefect", "worker", "start", "--pool", "local-docker"]
    restart: on-failure

volumes:
  postgres_data: